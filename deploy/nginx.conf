# 站点配置：主站(80) + 后台(8081)
# 放到 /etc/nginx/conf.d/blog.conf

# ── 主站（端口 80） ──────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /opt/blog/dist;
    index index.html;

    # 单页应用：非 /api、/uploads 的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传的图片
    location /uploads/ {
        alias /opt/blog/backend/uploads/;
    }
}

# ── 后台管理端（端口 8081） ──────────────────────────────
server {
    listen 8081;
    server_name _;

    root /opt/blog/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /opt/blog/backend/uploads/;
    }
}
