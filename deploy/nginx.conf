# 站点配置：主站(80) + 后台(8081)
# 放到 /etc/nginx/conf.d/blog.conf

# ── 登录接口限流：防暴力破解 ─────────────────────────────
# 每 IP 每分钟 5 次，突发 3 次（对正常登录足够，对刷密码的拦死）
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# ── 主站（端口 80） ──────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /opt/blog/dist;
    index index.html;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 单页应用：非 /api、/uploads 的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 登录接口：限流 + 反代
    location = /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传的图片
    location /uploads/ {
        alias /opt/blog/backend/uploads/;
    }
}

# ── 后台管理端（端口 8081） ──────────────────────────────
server {
    listen 8081;
    server_name _;

    root /opt/blog/admin/dist;
    index index.html;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 后台页面加一层 Basic Auth（与后台登录密码分开，密码文件 /etc/nginx/.htpasswd_admin）
    location / {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd_admin;
        try_files $uri $uri/ /index.html;
    }

    # 登录接口：限流 + 反代
    location = /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API 反向代理（不套 Basic Auth，靠 JWT 认证，否则 axios 请求会断）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传的图片
    location /uploads/ {
        alias /opt/blog/backend/uploads/;
    }
}
